<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Unlock | 2026 Zodiac Bundle Delivered</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Inter&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --blue: #1DA1F2; --bg: #000; }
        body { background:var(--bg); color:#fff; font-family:'Inter',sans-serif; text-align:center; margin:0; padding:0; overflow:hidden; }
        canvas { position:fixed; top:0; left:0; z-index:-1; opacity:0.9; }
        .container { height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; animation:fadeIn 2s; }
        .glow { font-family:'Cinzel',serif; font-size:4rem; background:linear-gradient(var(--gold), var(--blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 50px var(--blue); animation:pulse 3s infinite; }
        .card { background:linear-gradient(135deg,#111,#000); border:1px solid var(--blue); border-radius:40px; padding:50px; max-width:700px; box-shadow:0 0 80px var(--gold); }
        .preview { width:100%; border-radius:30px; margin:30px 0; box-shadow:0 0 40px var(--blue); }
        .btn-dl { background:linear-gradient(var(--gold), #b88e25); color:#000; padding:25px 70px; border-radius:50px; font-weight:700; text-decoration:none; box-shadow:0 0 60px var(--gold); transition:0.4s; position:relative; overflow:hidden; }
        .btn-dl::before { content:""; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition:0.5s; }
        .btn-dl:hover::before { left:100%; }
        .progress { width:100%; height:10px; background:#111; border-radius:10px; margin:20px 0; overflow:hidden; }
        .progress-bar { height:100%; background:var(--blue); width:0; animation:load 3s forwards; }
        .upsell { margin-top:60px; color:#ccc; }
        @keyframes fadeIn { from{opacity:0; scale:0.8;} to{opacity:1; scale:1;} }
        @keyframes pulse { 0%{text-shadow:0 0 30px var(--gold);} 50%{text-shadow:0 0 70px var(--blue);} 100%{text-shadow:0 0 30px var(--gold);} }
        @keyframes load { to{width:100%;} }
    </style>
</head>
<body>
    <canvas id="nebula"></canvas>
    <div class="container">
        <h1 class="glow">Cosmic Unlock Granted ✨</h1>
        <p>Your 2026 Zodiac Bundle is ready – dive into the stars!</p>
        <div class="card">
            <img class="preview" src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=1200" alt="Zodiac Bundle Preview">
            <b style="color:var(--gold); font-size:2rem;">Full AI Bundle (60+ 8K Files)</b>
            <div class="progress"><div class="progress-bar"></div></div>
            <a href="YOUR_ZIP_DOWNLOAD_LINK" class="btn-dl">Download Now</a>
        </div>
        <div class="upsell">
            <p>Upgrade to Personalized AI Zodiac? +$9.99</p>
            <a href="YOUR_UPSELL_STRIPE_LINK" class="btn-dl">Unlock Custom</a>
        </div>
    </div>
    <script>
        // Nebula背景 (爆炸效果)
        const canvas = document.getElementById('nebula');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = []; for(let i=0; i<500; i++) { particles.push({x:canvas.width/2, y:canvas.height/2, r:Math.random()*3+1, angle:Math.random()*Math.PI*2, speed:Math.random()*5+2}); }
        function explode() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.x += Math.cos(p.angle)*p.speed; p.y += Math.sin(p.angle)*p.speed; p.speed *= 0.98; if(p.speed > 0.1) { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle = `rgba(29,161,242,${p.r/4})`; ctx.fill(); } }); requestAnimationFrame(explode); } explode();
    </script>
</body>
</html>
