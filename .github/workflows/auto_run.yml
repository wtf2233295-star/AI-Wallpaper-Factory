name: Auto-Generator
on:
  schedule:
    - cron: '0 * * * *' # 每小时自动运行一次
  workflow_dispatch: # 允许你手动点火
jobs:
  run-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run Machine
        env:
          API_KEY: ${{ secrets.SF_API_KEY }}
        run: |
          pip install requests
          python main.py
