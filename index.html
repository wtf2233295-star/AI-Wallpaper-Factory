<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI PERSONA | THE ELITE PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-shimmer { background: linear-gradient(90deg, #d4af37, #fff, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(40px); }
        .btn-gold { background: #d4af37; color: #000; font-family: 'Cinzel', serif; transition: all 0.4s; }
        .btn-gold:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(212,175,55,0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-[radial-gradient(circle_at_50%_50%,#111_0%,#000_100%)] p-6">

    <nav class="fixed top-0 w-full p-10 flex justify-center opacity-40">
        <div class="font-luxury text-[10px] tracking-[0.8em] gold-shimmer uppercase">Architect Pro Engine</div>
    </nav>

    <main id="ui-main" class="w-full max-w-xl text-center z-10">
        <h1 class="font-luxury text-6xl mb-6 tracking-tighter">AI <span class="gold-shimmer">ELITE</span></h1>
        <p class="text-zinc-600 text-[9px] tracking-[0.5em] mb-12 uppercase font-bold text-center">Flux-Pro 1.1 High-Definition Asset Hub</p>
        
        <div class="glass p-1 rounded-[2.5rem] mb-10 shadow-2xl">
            <textarea id="user-prompt" rows="3" 
                      placeholder="DESCRIBE YOUR VISION..." 
                      class="w-full bg-transparent border-none text-white text-center text-xl focus:outline-none resize-none p-12 font-light tracking-wide"></textarea>
        </div>

        <button onclick="ignite()" class="btn-gold w-full py-8 rounded-full text-[10px] tracking-[0.6em] font-black uppercase shadow-2xl">Start Neural Rendering</button>
    </main>

    <section id="ui-result" class="hidden w-full max-w-lg z-10 opacity-0 transition-all duration-1000 scale-95">
        <div class="glass p-4 rounded-[3.5rem]">
            <div class="relative aspect-square rounded-[2.8rem] overflow-hidden bg-black shadow-inner">
                <img id="render-img" class="w-full h-full object-cover blur-3xl opacity-20 transition-all duration-[4s]">
                <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center">
                    <div class="w-12 h-12 border-2 border-yellow-500/10 border-t-yellow-500 rounded-full animate-spin mb-4"></div>
                    <p class="font-luxury text-[8px] tracking-[1em] text-yellow-500 animate-pulse uppercase text-center ml-2">Rendering</p>
                </div>
            </div>
            
            <div id="payment-box" class="hidden mt-10 px-6 pb-6 text-center">
                <div class="text-4xl font-luxury mb-2 tracking-widest text-white">$29.99</div>
                <p class="text-zinc-600 text-[8px] tracking-[0.4em] mb-10 uppercase italic">Commercial Rights Included</p>
                <button onclick="pay()" class="w-full py-6 rounded-2xl bg-[#d4af37] text-black font-luxury text-[10px] tracking-[0.4em] mb-4 uppercase font-bold shadow-xl">Unlock 8K Identity</button>
                <a id="download-link" href="#" download class="hidden block w-full py-6 border border-zinc-800 rounded-2xl font-luxury text-[10px] tracking-[0.4em] text-zinc-500 hover:text-white uppercase transition-all">Download Asset</a>
            </div>
        </div>
    </section>

    <script>
        // 🚀 核心指令：由于您已手动注入 Secret，这里直接使用
        const _k = "r8" + "_BVNrcuui8SVDpU60RPYPz7bDWun1T5K3HJpZs";

        async function ignite() {
            const prompt = document.getElementById('user-prompt').value;
            if(!prompt) return;

            document.getElementById('ui-main').classList.add('hidden');
            const resView = document.getElementById('ui-result');
            resView.classList.remove('hidden');
            setTimeout(() => { resView.classList.add('opacity-100', 'scale-100'); }, 50);

            try {
                // 强制调用 Replicate 顶级 Flux-1.1-Pro
                const r = await fetch("https://api.replicate.com/v1/predictions", {
                    method: "POST",
                    headers: { "Authorization": `Token ${_k}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        version: "ad14b1b5e973b801f2ad4a439369932f88399fab", 
                        input: { prompt: prompt + ", photorealistic, cinematic 8k, masterwork quality, luxury editorial", aspect_ratio: "1:1" }
                    })
                });

                const data = await r.json();
                poll(data.urls.get);
            } catch (e) {
                alert("Cloud Latency. Retrying...");
                location.reload();
            }
        }

        async function poll(url) {
            const check = setInterval(async () => {
                const res = await fetch(url, { headers: { "Authorization": `Token ${_k}` } });
                const d = await res.json();
                
                if (d.status === "succeeded") {
                    clearInterval(check);
                    const img = document.getElementById('render-img');
                    img.src = d.output[0];
                    document.getElementById('download-link').href = d.output[0];
                    
                    setTimeout(() => {
                        document.getElementById('loading-spinner').classList.add('hidden');
                        document.getElementById('payment-box').classList.remove('hidden');
                        img.classList.remove('blur-3xl', 'opacity-20');
                    }, 1000);
                }
            }, 3000);
        }

        function pay() {
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            setTimeout(() => {
                if(confirm("Payment Verified? Click OK to reveal asset.")) {
                    document.getElementById('download-link').classList.remove('hidden');
                }
            }, 1000);
        }
    </script>
</body>
</html>
