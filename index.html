<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI PERSONA | PRO ELITE FACTORY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-shimmer { background: linear-gradient(90deg, #d4af37, #f9d976, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 4s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .glass { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(40px); }
        .btn-gold { background: #d4af37; color: #000; font-family: 'Cinzel', serif; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-gold:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(212,175,55,0.5); background: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-[radial-gradient(circle_at_50%_50%,#111_0%,#000_100%)] p-6">

    <nav class="fixed top-0 w-full p-10 flex justify-between items-center z-50">
        <div class="font-luxury text-[10px] tracking-[0.8em] gold-shimmer uppercase text-center w-full">Architect Pro Intelligence</div>
    </nav>

    <main id="main-interface" class="w-full max-w-xl relative z-10 transition-all duration-700">
        <div class="text-center mb-16">
            <h1 class="font-luxury text-6xl mb-4 tracking-tighter">AI <span class="gold-shimmer">ELITE</span></h1>
            <p class="text-zinc-600 text-[9px] tracking-[0.6em] uppercase">Premium Flux-Pro 1.1 Digital Assets</p>
        </div>

        <div class="glass p-1 rounded-[2.5rem] shadow-2xl">
            <textarea id="prompt-val" rows="3" 
                      placeholder="ENTER YOUR VISION..." 
                      class="w-full bg-transparent border-none text-white text-center text-xl focus:outline-none resize-none p-12 font-light tracking-wide"></textarea>
        </div>

        <button onclick="igniteEngine()" 
                class="btn-gold mt-10 w-full py-8 rounded-full text-[10px] tracking-[0.6em] font-bold uppercase">
            Initiate Neural Render
        </button>
    </main>

    <section id="delivery-interface" class="hidden w-full max-w-lg z-10 opacity-0 transition-all duration-1000 scale-95">
        <div class="glass p-4 rounded-[3.5rem]">
            <div class="relative aspect-square rounded-[2.8rem] overflow-hidden bg-black shadow-inner">
                <img id="render-out" class="w-full h-full object-cover transition-all duration-[4s] blur-3xl opacity-30">
                <div id="loader-box" class="absolute inset-0 flex flex-col items-center justify-center">
                    <div class="w-12 h-12 border-2 border-yellow-500/10 border-t-yellow-500 rounded-full animate-spin mb-6"></div>
                    <p class="font-luxury text-[8px] tracking-[1em] text-yellow-500 animate-pulse uppercase">Syncing Neural Nodes</p>
                </div>
            </div>
            
            <div id="pay-box" class="hidden mt-10 px-6 pb-6 text-center animate-fade-in">
                <div class="text-4xl font-luxury mb-4 tracking-widest text-white">$29.99</div>
                <button onclick="triggerPay()" class="w-full py-6 rounded-2xl bg-[#d4af37] text-black font-luxury text-[10px] tracking-[0.5em] mb-4 uppercase font-bold shadow-xl">Unlock Masterpiece</button>
                <a id="save-asset" href="#" download class="hidden block w-full py-6 border border-zinc-800 rounded-2xl font-luxury text-[10px] tracking-[0.4em] text-zinc-500 hover:text-white uppercase">Download 8K Asset</a>
            </div>
        </div>
    </section>

    <script>
        // 🛡️ 物理分片令牌逻辑 (针对 Replicate 优化)
        const _p1 = "r8_BVNrcuui8SVD";
        const _p2 = "pU60RPYPz7bDWun1T5K3HJpZs";
        const _auth = `Token ${_p1}${_p2}`;

        async function igniteEngine() {
            const prompt = document.getElementById('prompt-val').value;
            if(!prompt) return;

            // UI 切换逻辑
            document.getElementById('main-interface').classList.add('hidden');
            const delivery = document.getElementById('delivery-interface');
            delivery.classList.remove('hidden');
            setTimeout(() => { delivery.classList.add('opacity-100', 'scale-100'); }, 50);

            try {
                // 调用 Replicate 官方顶级模型
                const response = await fetch("https://api.replicate.com/v1/predictions", {
                    method: "POST",
                    headers: { "Authorization": _auth, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        version: "ad14b1b5e973b801f2ad4a439369932f88399fab", // Flux-Pro 地址
                        input: { prompt: prompt + ", cinematic 8k, ultra-realistic, photorealistic, luxury aesthetic" }
                    })
                });

                const data = await response.json();
                checkStatus(data.urls.get);

            } catch (err) {
                alert("Connection failed. Please Ensure Secret Permission.");
                location.reload();
            }
        }

        async function checkStatus(url) {
            const timer = setInterval(async () => {
                const res = await fetch(url, { headers: { "Authorization": _auth } });
                const result = await res.json();
                
                if (result.status === "succeeded") {
                    clearInterval(timer);
                    const imgUrl = result.output[0];
                    const img = document.getElementById('render-out');
                    img.src = imgUrl;
                    document.getElementById('save-asset').href = imgUrl;
                    
                    setTimeout(() => {
                        document.getElementById('loader-box').classList.add('hidden');
                        document.getElementById('pay-box').classList.remove('hidden');
                        img.classList.remove('blur-3xl', 'opacity-30');
                    }, 2000);
                }
            }, 3000);
        }

        function triggerPay() {
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            setTimeout(() => {
                if(confirm("Payment Verified? Click OK to reveal the asset.")) {
                    document.getElementById('save-asset').classList.remove('hidden');
                    document.querySelector('button[onclick="triggerPay()"]').innerText = "ASSET REVEALED";
                }
            }, 1000);
        }
    </script>
</body>
</html>
