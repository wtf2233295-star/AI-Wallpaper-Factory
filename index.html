<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI PERSONA | THE FLUX PRO ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; user-select: none; overflow-x: hidden; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-shimmer { background: linear-gradient(90deg, #d4af37, #fff, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .glass { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(212, 175, 55, 0.1); backdrop-filter: blur(50px); }
        
        /* 🛡️ 物理防盗层：右键保存全是空 */
        .secure-frame { position: relative; aspect-ratio: 1/1; border-radius: 3rem; overflow: hidden; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); }
        .shield { position: absolute; inset: 0; z-index: 100; cursor: crosshair; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='); }
        .watermark-overlay { position: absolute; inset: 0; z-index: 50; pointer-events: none; background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 50px); }
        
        .btn-premium { background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #d4af37 100%); color: #000; font-family: 'Cinzel', serif; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .btn-premium:hover { transform: scale(1.02); box-shadow: 0 0 60px rgba(212,175,55,0.4); filter: brightness(1.1); }
        
        .gallery-img { transition: transform 0.8s; opacity: 0.6; }
        .gallery-img:hover { transform: scale(1.1); opacity: 1; }
    </style>
</head>
<body oncontextmenu="return false">

    <nav class="w-full p-10 flex justify-between items-center max-w-7xl mx-auto relative z-20">
        <div class="font-luxury text-[11px] tracking-[1em] gold-shimmer uppercase">AI-Wallpaper-Factory v8.0</div>
        <div class="text-[9px] tracking-[0.5em] text-zinc-600 uppercase">Flux.1 Pro Node Connected</div>
    </nav>

    <main id="hero" class="max-w-4xl mx-auto text-center mt-12 px-6 transition-all duration-1000">
        <h1 class="font-luxury text-7xl md:text-9xl mb-6 tracking-tighter uppercase leading-none">AI <span class="gold-shimmer">Persona</span></h1>
        <p class="text-zinc-400 text-[11px] tracking-[0.8em] mb-16 uppercase italic">Minting Digital Excellence in 8K</p>
        
        <div class="glass p-2 rounded-[3.5rem] mb-12 shadow-[0_0_100px_rgba(212,175,55,0.05)]">
            <textarea id="prompt" rows="3" 
                      placeholder="DESCRIBE YOUR MASTERPIECE..." 
                      class="w-full bg-transparent border-none text-white text-center text-2xl focus:outline-none resize-none p-16 font-light tracking-widest"></textarea>
        </div>
        <button onclick="ignite()" class="btn-premium w-full py-10 rounded-full text-[13px] tracking-[0.8em] font-black uppercase shadow-2xl">Start Pro Rendering</button>

        <div class="mt-32 pb-20">
            <p class="font-luxury text-xs tracking-[1.5em] text-zinc-600 mb-12 uppercase">Elite Portfolio</p>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="secure-frame"><div class="shield"></div><img src="https://image.pollinations.ai/prompt/cyberpunk%20lion%20gold?seed=1&model=flux" class="gallery-img w-full h-full object-cover"></div>
                <div class="secure-frame"><div class="shield"></div><img src="https://image.pollinations.ai/prompt/luxury%20watch%20concept?seed=2&model=flux" class="gallery-img w-full h-full object-cover"></div>
                <div class="secure-frame"><div class="shield"></div><img src="https://image.pollinations.ai/prompt/ethereal%20fashion%20photography?seed=3&model=flux" class="gallery-img w-full h-full object-cover"></div>
                <div class="secure-frame"><div class="shield"></div><img src="https://image.pollinations.ai/prompt/ancient%20dragon%20artifact?seed=4&model=flux" class="gallery-img w-full h-full object-cover"></div>
            </div>
        </div>
    </main>

    <section id="rendering" class="hidden fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-2xl">
            <div id="output-box" class="secure-frame glass p-1 mb-12 opacity-0 transition-all duration-1000 scale-95">
                <div class="shield"></div>
                <div class="watermark-overlay"></div>
                <img id="result-img" class="w-full h-full object-cover rounded-[2.8rem]">
                <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-black">
                    <div class="w-20 h-[1px] bg-zinc-800 relative overflow-hidden mb-8">
                        <div class="absolute inset-0 bg-yellow-500 animate-[loading_2s_infinite]"></div>
                    </div>
                    <p class="font-luxury text-[9px] tracking-[1.2em] text-yellow-500 animate-pulse uppercase">Assembling Pixels</p>
                </div>
            </div>

            <div id="checkout" class="hidden glass p-12 rounded-[4rem] text-center animate-fade-in border border-white/5">
                <div class="flex justify-center items-center gap-6 mb-8">
                    <span class="text-zinc-700 line-through text-2xl font-light tracking-widest">$149.00</span>
                    <span class="text-white text-6xl font-black font-luxury tracking-tighter">$29.99</span>
                </div>
                
                <div class="space-y-4 mb-12 text-[10px] tracking-[0.4em] text-zinc-400 uppercase">
                    <p class="flex items-center justify-center gap-2"><span class="text-yellow-600">✦</span> 8K Lossless Cinema Quality</p>
                    <p class="flex items-center justify-center gap-2"><span class="text-yellow-600">✦</span> Unlimited Commercial Sovereign Rights</p>
                    <p class="flex items-center justify-center gap-2"><span class="text-yellow-600">✦</span> Original EXIF Artist Metadata</p>
                </div>

                <button onclick="pay()" class="btn-premium w-full py-8 rounded-3xl text-[14px] tracking-[0.6em] font-black uppercase mb-6">Unlock Full Ownership</button>
                <button onclick="location.reload()" class="text-[9px] tracking-[1em] text-zinc-600 uppercase hover:text-white transition-all">Discard and Restart</button>
                <a id="dl-link" href="#" download class="hidden block w-full py-8 mt-4 border border-zinc-800 rounded-3xl font-luxury text-[11px] tracking-[0.5em] text-white uppercase hover:bg-white hover:text-black">Download Original Asset</a>
            </div>
        </div>
    </section>

    <script>
        let currentImg = '';

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        function ignite() {
            const p = document.getElementById('prompt').value;
            if(!p) return;

            document.getElementById('hero').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('hero').classList.add('hidden');
                document.getElementById('rendering').classList.remove('hidden');
            }, 500);

            // ⚡ 核心逻辑：使用 Flux-Pro 模型进行单点突破
            const seed = Math.floor(Math.random() * 999999);
            currentImg = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", flux pro style, 8k, extremely detailed, cinematic photorealistic, fashion magazine shot")}?model=flux&seed=${seed}&width=1024&height=1024&nologo=true`;

            const img = document.getElementById('result-img');
            img.src = currentImg;

            img.onload = () => {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('output-box').classList.add('opacity-100', 'scale-100');
                document.getElementById('checkout').classList.remove('hidden');
            };
        }

        function pay() {
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            setTimeout(() => {
                if(confirm("Payment Authorized? OK will remove watermarks and grant 8K access.")) {
                    document.getElementById('dl-link').classList.remove('hidden');
                    document.getElementById('dl-link').href = currentImg;
                    document.querySelector('.watermark-overlay').style.display = 'none';
                    document.querySelector('#output-box .shield').style.display = 'none';
                    alert("Ownership Confirmed. Digital Identity Unlocked.");
                }
            }, 1000);
        }

        // 终极保护
        document.onkeydown = (e) => {
            if (e.ctrlKey && (e.key==='s' || e.key==='u' || e.key==='i' || e.key==='p')) return false;
            if (e.key === 'F12') return false;
        };
    </script>
</body>
</html>
