<script>
    const HF_TOKEN = "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";
    let CURRENT_IMG_URL = "";

    async function startProcess() {
        const prompt = document.getElementById('user-prompt').value;
        if(!prompt) { alert("请输入生成指令"); return; }

        // 第一步：展示生成状态
        document.getElementById('main-ui').classList.add('hidden');
        document.getElementById('delivery-ui').classList.remove('hidden');
        document.getElementById('loading-state').classList.remove('hidden');
        document.getElementById('result-state').classList.add('hidden');

        // 第二步：实时生成预览图（带水印效果）
        await callFluxAPI(prompt);
    }

    async function callFluxAPI(prompt) {
        try {
            const response = await fetch(
                "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell",
                {
                    headers: { Authorization: `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({ inputs: prompt + ", masterpiece, high-end luxury, 8k" }),
                }
            );

            const blob = await response.blob();
            CURRENT_IMG_URL = URL.createObjectURL(blob);

            // 展示带“未支付”视觉压力的预览图
            renderPreview();

        } catch (err) {
            alert("全球算力繁忙，请刷新重试");
        }
    }

    function renderPreview() {
        document.getElementById('loading-state').classList.add('hidden');
        const resultState = document.getElementById('result-state');
        resultState.classList.remove('hidden');
        
        const img = document.getElementById('final-image');
        img.src = CURRENT_IMG_URL;
        img.style.filter = "blur(8px) grayscale(50%)"; // 先尝：给一张模糊的图
        
        // 修改下载按钮为“去支付解锁”
        const btn = document.getElementById('download-anchor');
        btn.innerText = "立即支付 $29.99 解锁 8K 原图";
        btn.onclick = function(e) {
            e.preventDefault();
            unlockFullAsset();
        };
    }

    function unlockFullAsset() {
        // 跳转支付
        window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
        
        // 模拟支付成功后的反馈（实际中可配合支付回调，目前采用信任交付）
        alert("正在核实支付状态... 验证成功后将自动解锁超清原图！");
        
        setTimeout(() => {
            const img = document.getElementById('final-image');
            img.style.filter = "none"; // 移除模糊
            const btn = document.getElementById('download-anchor');
            btn.innerText = "下载 8K 物理原图";
            btn.href = CURRENT_IMG_URL;
            btn.onclick = null; // 恢复下载功能
            alert("支付已验证！资产已解锁，请保存。");
        }, 3000);
    }
</script>
