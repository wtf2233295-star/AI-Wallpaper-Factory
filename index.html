<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI MASTER | CINEMATIC 8K ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@200;400;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; user-select: none; overflow-x: hidden; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-shimmer { background: linear-gradient(90deg, #d4af37, #fff, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        
        /* 玻璃拟态与流光 */
        .glass-panel { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.1); backdrop-filter: blur(60px); }
        .secure-shield { position: absolute; inset: 0; z-index: 100; cursor: crosshair; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='); }
        
        /* 国际化高端按钮 */
        .btn-elite { background: #d4af37; color: #000; font-family: 'Cinzel', serif; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 40px -10px rgba(212,175,55,0.4); }
        .btn-elite:hover { transform: translateY(-3px) scale(1.02); background: #fff; box-shadow: 0 20px 60px -10px rgba(212,175,55,0.6); }

        .portfolio-card { position: relative; border-radius: 2rem; overflow: hidden; aspect-ratio: 1/1; opacity: 0.6; transition: all 0.5s; }
        .portfolio-card:hover { opacity: 1; transform: scale(1.05); }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,rgba(212,175,55,0.05)_0%,transparent_70%)] pointer-events-none"></div>

    <nav class="w-full p-10 flex justify-between items-center max-w-7xl mx-auto relative z-20">
        <div class="font-luxury text-[11px] tracking-[1.2em] gold-shimmer uppercase">Elite Asset Foundry</div>
        <div class="px-4 py-1 border border-zinc-800 rounded-full text-[8px] tracking-[0.4em] text-zinc-500 uppercase">Pro Node: v8.2-Flux</div>
    </nav>

    <main id="ui-main" class="max-w-4xl mx-auto text-center mt-12 px-6 relative z-10 transition-all duration-1000">
        <h1 class="font-luxury text-7xl md:text-9xl mb-4 tracking-tighter uppercase leading-[0.9]">AI <span class="gold-shimmer">Persona</span></h1>
        <p class="text-zinc-500 text-[10px] tracking-[0.8em] mb-16 uppercase italic">Cinema-Grade 8K Digital Identity Mint</p>
        
        <div class="glass-panel p-2 rounded-[4rem] mb-12">
            <textarea id="user-prompt" rows="3" 
                      placeholder="ENTER VISION: 'Cyberpunk deity in liquid gold, photorealistic, 8k...'" 
                      class="w-full bg-transparent border-none text-white text-center text-2xl focus:outline-none resize-none p-16 font-light tracking-[0.1em]"></textarea>
        </div>
        <button onclick="startProRender()" class="btn-elite w-full py-10 rounded-full text-[14px] tracking-[1em] font-black uppercase">Start Neural Rendering</button>

        <div class="mt-32 pb-32">
            <h3 class="font-luxury text-[10px] tracking-[1.5em] text-zinc-600 mb-12 uppercase">Elite Style Matrix</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="portfolio-card border border-white/5"><div class="secure-shield"></div><img src="https://r2.pollinations.ai/prompt/cyberpunk%20warrior%20high%20fashion%208k?seed=88&model=flux" class="w-full h-full object-cover"></div>
                <div class="portfolio-card border border-white/5"><div class="secure-shield"></div><img src="https://r2.pollinations.ai/prompt/renaissance%20oil%20painting%20of%20a%20modern%20city?seed=99&model=flux" class="w-full h-full object-cover"></div>
                <div class="portfolio-card border border-white/5"><div class="secure-shield"></div><img src="https://r2.pollinations.ai/prompt/futuristic%20liquid%20metal%20sculpture%208k?seed=11&model=flux" class="w-full h-full object-cover"></div>
                <div class="portfolio-card border border-white/5"><div class="secure-shield"></div><img src="https://r2.pollinations.ai/prompt/mythical%20creature%20hyper-realistic%20details?seed=22&model=flux" class="w-full h-full object-cover"></div>
            </div>
        </div>
    </main>

    <section id="ui-result" class="hidden fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-8 transition-opacity duration-1000 opacity-0">
        <div class="w-full max-w-2xl relative">
            <div class="relative aspect-square glass-panel p-1 rounded-[3.5rem] overflow-hidden mb-12 shadow-[0_0_100px_rgba(212,175,55,0.1)]">
                <div class="secure-shield" id="result-shield"></div>
                <div id="wm-layer" class="absolute inset-0 z-50 pointer-events-none flex items-center justify-center">
                    <div class="text-[8px] text-white/10 rotate-45 scale-[4] font-black whitespace-nowrap">UNLICENSED PREVIEW ● UNLICENSED PREVIEW</div>
                </div>
                <img id="final-asset" class="w-full h-full object-cover rounded-[3.2rem] opacity-0 transition-opacity duration-2000">
                <div id="render-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90">
                    <div class="w-24 h-[1px] bg-zinc-800 relative overflow-hidden mb-6">
                        <div class="absolute inset-0 bg-yellow-600 animate-[loading_2s_infinite]"></div>
                    </div>
                    <p class="font-luxury text-[9px] tracking-[1.5em] text-yellow-600 animate-pulse uppercase">Syncing Flux.1 Pro Node</p>
                </div>
            </div>

            <div id="pay-module" class="hidden animate-fade-in text-center">
                <div class="flex justify-center items-center gap-8 mb-8">
                    <span class="text-zinc-700 line-through text-3xl font-light tracking-widest">$199.00</span>
                    <span class="text-white text-7xl font-black font-luxury tracking-tighter">$29.99</span>
                </div>
                
                <p class="text-zinc-500 text-[9px] tracking-[0.5em] mb-12 uppercase font-bold italic">Exclusive Commercial Sovereignty License</p>
                
                <button onclick="handlePurchase()" class="btn-elite w-full py-9 rounded-3xl text-[14px] tracking-[0.8em] font-black uppercase shadow-2xl">Claim Full Ownership</button>
                <button onclick="location.reload()" class="block w-full mt-6 text-[8px] tracking-[1em] text-zinc-600 uppercase hover:text-white transition-all">Destroy and Re-render</button>
                <a id="master-download" href="#" download class="hidden block w-full py-9 mt-4 border border-zinc-800 rounded-3xl font-luxury text-[11px] tracking-[0.6em] text-white uppercase hover:bg-white hover:text-black">Download 8K Source</a>
            </div>
        </div>
    </section>

    <script>
        let globalImg = '';
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        async function startProRender() {
            const p = document.getElementById('user-prompt').value;
            if(!p) return;

            document.getElementById('ui-main').classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                document.getElementById('ui-main').classList.add('hidden');
                const res = document.getElementById('ui-result');
                res.classList.remove('hidden');
                setTimeout(() => res.classList.add('opacity-100'), 50);
            }, 600);

            // ⚡ 对接顶级 Flux-Pro 算力，注入极致画质提示词
            const seed = Math.floor(Math.random() * 9999999);
            globalImg = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", flux pro style, movie poster, 8k resolution, extreme micro details, sharp focus, ray tracing, masterpiece")}?model=flux-pro&seed=${seed}&width=1440&height=1440&nologo=true`;

            const img = document.getElementById('final-asset');
            img.src = globalImg;

            img.onload = () => {
                document.getElementById('render-loader').classList.add('hidden');
                document.getElementById('pay-module').classList.remove('hidden');
                img.classList.remove('opacity-0');
            };
        }

        function handlePurchase() {
            // 对接您的收款
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            
            setTimeout(() => {
                if(confirm("Verify Payment: Has the $29.99 transaction been completed?")) {
                    document.getElementById('master-download').classList.remove('hidden');
                    document.getElementById('master-download').href = globalImg;
                    document.getElementById('wm-layer').style.display = 'none';
                    document.getElementById('result-shield').style.display = 'none';
                    alert("License Verified. 8K Master Asset Unlocked.");
                }
            }, 1000);
        }

        // 🛡️ 顶级保护：禁止一切右键和调试
        document.onkeydown = e => {
            if (e.ctrlKey && (e.key==='s' || e.key==='u' || e.key==='i' || e.key==='p')) return false;
            if (e.key === 'F12') return false;
        };
    </script>
</body>
</html>
