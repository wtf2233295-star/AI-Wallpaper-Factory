<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wallpaper Factory | 8K 独家分身</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #f9d976 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .preview-blur { filter: blur(12px) brightness(0.7); transition: all 1s ease; }
        .loading-bar { height: 100%; background: #d4af37; transition: width 0.3s ease; box-shadow: 0 0 10px #d4af37; }
        .glow-btn { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-20">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-yellow-600 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-yellow-900 rounded-full blur-[120px]"></div>
    </div>

    <div id="main-ui" class="relative z-10 w-full max-w-lg text-center">
        <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">AI <span class="gold-text">Wallpaper</span> Factory</h1>
        <p class="text-zinc-500 text-xs mb-8 tracking-[0.3em]">FLUX.1 SCHNELL · 8K RESOLUTION</p>

        <div class="glass p-6 rounded-3xl mb-6">
            <textarea id="user-prompt" rows="3" 
                      placeholder="输入任何想象... (例如: 赛博朋克风格的商务狮子)" 
                      class="w-full bg-transparent border-none text-white text-lg placeholder-zinc-700 outline-none resize-none"></textarea>
        </div>
 
        <button onclick="startGeneration()" 
                class="glow-btn w-full py-5 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-black text-xl rounded-2xl hover:scale-[1.02] transition-transform">
            立即渲染预览图
        </button>
        <p class="mt-6 text-[10px] text-zinc-600 tracking-widest uppercase italic">物理资产生成费用: $29.99</p>
    </div>

    <div id="delivery-ui" class="hidden relative z-10 w-full max-w-lg">
        <div class="glass p-4 rounded-[2.5rem] overflow-hidden">
            <div class="relative aspect-square rounded-[2rem] overflow-hidden bg-zinc-900 mb-6">
                <img id="final-image" class="w-full h-full object-cover preview-blur">
