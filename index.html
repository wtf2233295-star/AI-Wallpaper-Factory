<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI PERSONA | THE 8K IDENTITY FACTORY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;900&display=swap');
        
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-tech { font-family: 'Syncopate', sans-serif; }
        
        /* 奢华动态背景 / Luxury Background */
        .ambient-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            z-index: -1;
        }
        .gold-orb {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; animation: float 20s infinite alternate;
        }

        /* 核心动效 / Core Animations */
        @keyframes float { from { transform: translate(-10%, -10%); } to { transform: translate(10%, 10%); } }
        .shimmer { background: linear-gradient(90deg, #333 0%, #d4af37 50%, #333 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        /* 玻璃卡片 / Premium Glass */
        .glass-panel { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .btn-gold { background: #d4af37; color: #000; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .btn-gold:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212,175,55,0.3); }
        
        input::placeholder { color: #333; text-transform: uppercase; letter-spacing: 0.2em; font-size: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="ambient-glow">
        <div class="gold-orb" style="top: -20%; left: -10%;"></div>
        <div class="gold-orb" style="bottom: -20%; right: -10%;"></div>
    </div>

    <nav class="fixed top-0 w-full p-8 flex justify-between items-center z-50">
        <div class="font-tech text-[10px] tracking-[0.5em] shimmer">AI WALLPAPER GENERATOR</div>
        <div class="flex items-center gap-4 text-[10px] tracking-widest opacity-30">
            <span>FLUX.1 ENGINE</span>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        </div>
    </nav>

    <div id="app-container" class="w-full max-w-xl relative z-10">
        
        <div id="input-stage" class="text-center">
            <h1 class="font-tech text-5xl font-bold mb-4 tracking-tighter">PREMIUM<br><span class="shimmer">IDENTITY</span></h1>
            <p class="text-zinc-500 text-[10px] tracking-[0.4em] mb-12 uppercase">Crafting 8K Digital Assets for the Global Elite</p>
            
            <div class="glass-panel p-2 rounded-[2rem] mb-8">
                <textarea id="prompt-input" rows="3" 
                          placeholder="Describe your vision (e.g. Cyberpunk CEO, Golden Lion)..." 
                          class="w-full bg-transparent border-none text-white text-center text-lg focus:outline-none resize-none p-6"></textarea>
            </div>

            <button onclick="startProcess()" 
                    class="btn-gold w-full py-6 rounded-2xl font-tech text-xs tracking-[0.3em] font-bold">
                INITIATE NEURAL RENDER
            </button>
        </div>

        <div id="delivery-stage" class="hidden">
            <div class="glass-panel p-4 rounded-[3rem]">
                <div class="relative aspect-square rounded-[2.5rem] overflow-hidden bg-zinc-950">
                    <img id="output-image" class="w-full h-full object-cover transition-all duration-[3000ms] scale-110 blur-3xl opacity-50">
                    
                    <div id="scanner" class="absolute inset-0 flex flex-col items-center justify-center">
                        <div class="w-full h-[1px] bg-yellow-500/30 absolute top-0 animate-[scan_3s_infinite]"></div>
                        <p id="status-text" class="font-tech text-[9px] tracking-[0.5em] text-yellow-500">PROCESSING NEURAL NODES...</p>
                    </div>
                </div>

                <div id="cta-area" class="hidden mt-8 px-2 pb-4 text-center">
                    <div class="text-3xl font-black mb-2">$29.99</div>
                    <p class="text-zinc-500 text-[9px] tracking-widest mb-8 uppercase">Commercial License & 8K Master Included</p>
                    <button id="pay-action" onclick="handlePayment()" 
                            class="btn-gold w-full py-6 rounded-2xl font-tech text-xs tracking-[0.3em] font-bold mb-6">
                        UNLOCK FULL ASSET
                    </button>
                    <div id="download-zone" class="hidden">
                        <a id="save-btn" href="#" download="AI_PREMIUM_8K.png" 
                           class="inline-block w-full py-6 border border-zinc-800 text-white font-tech text-[10px] tracking-widest rounded-2xl hover:bg-white hover:text-black transition-all uppercase">
                            Download Masterpiece
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>

    <script>
        // 核心机密 / Core Logic
        const _P1 = "hf_gkNPoMerlEMcSI";
        const _P2 = "exssfWbebbkpOfaLBNAz";
        const _HEADER = `Bearer ${_P1}${_P2}`;

        async function startProcess() {
            const prompt = document.getElementById('prompt-input').value;
            if(!prompt) return;

            document.getElementById('input-stage').style.display = 'none';
            document.getElementById('delivery-stage').style.display = 'block';

            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell",
                    {
                        headers: { Authorization: _HEADER, "Content-Type": "application/json" },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt + ", cinematic 8k, ultra-realistic, highly detailed, vogue style" }),
                    }
                );

                if(!response.ok) throw new Error("API Limit");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                const img = document.getElementById('output-image');
                img.src = url;
                document.getElementById('save-btn').href = url;

                // 模拟渲染完成 / Simulate completion
                setTimeout(() => {
                    document.getElementById('scanner').classList.add('hidden');
                    document.getElementById('cta-area').classList.remove('hidden');
                    img.classList.remove('blur-3xl', 'opacity-50');
                    img.classList.add('scale-100');
                    console.log("Render Complete.");
                }, 2000);

            } catch (err) {
                alert("The cloud is busy. Re-initiating...");
                location.reload();
            }
        }

        function handlePayment() {
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            
            setTimeout(() => {
                if(confirm("Payment Verified? Click OK to reveal the 8K Master.")) {
                    document.getElementById('pay-action').classList.add('hidden');
                    document.getElementById('download-zone').classList.remove('hidden');
                }
            }, 1500);
        }
    </script>
</body>
</html>
