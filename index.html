<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI WALLPAPER FACTORY V3.0 | PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; user-select: none; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-shimmer { background: linear-gradient(90deg, #d4af37, #fff, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(40px); }
        /* 核心防盗：不可点击与拖拽 */
        .watermark-overlay { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(212,175,55,0.1) 0px, rgba(212,175,55,0.1) 20px, transparent 20px, transparent 40px); pointer-events: none; z-index: 10; }
        .protected-img { -webkit-user-drag: none; pointer-events: none; }
        .grid-item { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .grid-item:hover { transform: scale(1.05); z-index: 20; border-color: #d4af37; }
        .active-selection { border: 2px solid #d4af37 !important; box-shadow: 0 0 30px rgba(212,175,55,0.4); }
    </style>
</head>
<body oncontextmenu="return false" class="min-h-screen flex flex-col items-center bg-[radial-gradient(circle_at_50%_50%,#111_0%,#000_100%)] p-6">

    <nav class="w-full p-8 flex justify-between items-center max-w-6xl">
        <div class="font-luxury text-[10px] tracking-[0.8em] gold-shimmer uppercase">Architect Factory v3.0</div>
        <div class="text-zinc-500 text-[8px] tracking-widest uppercase">Multi-Thread Rendering Active</div>
    </nav>

    <main id="engine-view" class="w-full max-w-xl text-center mt-20">
        <h1 class="font-luxury text-6xl mb-6 tracking-tighter">AI <span class="gold-shimmer">GENIUS</span></h1>
        <div class="glass p-1 rounded-[2.5rem] mb-10 shadow-2xl">
            <textarea id="main-prompt" rows="3" 
                      placeholder="DESCRIBE THE MASTERPIECE..." 
                      class="w-full bg-transparent border-none text-white text-center text-xl focus:outline-none resize-none p-12 font-light tracking-wide"></textarea>
        </div>
        <button onclick="igniteBatch()" class="w-full py-8 rounded-full bg-[#d4af37] text-black font-luxury text-[10px] tracking-[0.6em] font-black uppercase shadow-2xl hover:bg-white transition-all">Generate 4 Elite Options</button>
    </main>

    <section id="gallery-view" class="hidden w-full max-w-6xl mt-10 opacity-0 transition-all duration-1000">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12" id="image-grid">
            </div>

        <div id="checkout-panel" class="hidden glass p-8 rounded-[3rem] max-w-md mx-auto text-center animate-bounce-subtle">
            <div class="text-4xl font-luxury mb-2 text-white">$29.99</div>
            <p class="text-zinc-500 text-[8px] tracking-widest mb-8 uppercase italic">Selected Asset: Ultra-HD 8K License</p>
            <button onclick="handlePayment()" class="w-full py-6 rounded-2xl bg-[#d4af37] text-black font-luxury text-[10px] tracking-[0.4em] mb-4 uppercase font-bold">Unlock Selection</button>
            <button id="final-dl" onclick="saveImage()" class="hidden w-full py-6 border border-zinc-700 rounded-2xl font-luxury text-[10px] tracking-[0.4em] text-white uppercase hover:bg-white hover:text-black transition-all">Download Masterpiece</button>
        </div>
    </section>

    <script>
        let selectedUrl = '';

        function igniteBatch() {
            const prompt = document.getElementById('main-prompt').value;
            if(!prompt) return;

            document.getElementById('engine-view').classList.add('hidden');
            const gallery = document.getElementById('gallery-view');
            gallery.classList.remove('hidden');
            setTimeout(() => { gallery.classList.add('opacity-100'); }, 50);

            const grid = document.getElementById('image-grid');
            grid.innerHTML = ''; 

            // 🚀 自主优化逻辑：一次性发起 4 个独立种子请求
            for(let i=0; i<4; i++) {
                const seed = Math.floor(Math.random() * 999999) + i;
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ", cinematic 8k, extreme detail, masterpiece, sharp focus")}?model=flux&seed=${seed}&width=1024&height=1024&nologo=true`;
                
                const card = document.createElement('div');
                card.className = "grid-item glass p-2 rounded-[2rem] relative overflow-hidden aspect-square";
                card.innerHTML = `
                    <div class="watermark-overlay"></div>
                    <img src="${url}" class="protected-img w-full h-full object-cover rounded-[1.8rem] opacity-60 transition-opacity duration-1000" onload="this.classList.remove('opacity-60')">
                    <div class="absolute inset-0 z-30" onclick="selectCard(this, '${url}')"></div>
                `;
                grid.appendChild(card);
            }
        }

        function selectCard(el, url) {
            document.querySelectorAll('.grid-item').forEach(c => c.classList.remove('active-selection'));
            el.parentElement.classList.add('active-selection');
            selectedUrl = url;
            document.getElementById('checkout-panel').classList.remove('hidden');
            // 每次选择，重置下载按钮
            document.getElementById('final-dl').classList.add('hidden');
        }

        function handlePayment() {
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            setTimeout(() => {
                if(confirm("Payment detected. Do you want to unlock the 8K uncompressed file?")) {
                    document.getElementById('final-dl').classList.remove('hidden');
                    document.querySelector('.active-selection .watermark-overlay').style.display = 'none';
                    document.querySelector('.active-selection img').style.pointerEvents = 'auto';
                }
            }, 1000);
        }

        function saveImage() {
            const link = document.createElement('a');
            link.href = selectedUrl;
            link.download = `Elite_Asset_${Date.now()}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 屏蔽键盘快捷键截屏
        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'u' || e.key === 'i')) {
                e.preventDefault();
                alert("Security Protocol Active.");
            }
        });
    </script>
</body>
</html>
