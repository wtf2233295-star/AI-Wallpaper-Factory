<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI WALLPAPER FACTORY | ELITE V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-shimmer { background: linear-gradient(90deg, #d4af37, #fff, #d4af37); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 5s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .glass { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.15); backdrop-filter: blur(40px); }
        
        /* 🛡️ 暴力防盗：物理隔离层 */
        .img-container { position: relative; overflow: hidden; border-radius: 2rem; aspect-ratio: 1/1; cursor: pointer; }
        .shield { position: absolute; inset: 0; z-index: 50; } /* 挡住右键，点击这一层 */
        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255,255,255,0.1); transform: rotate(-45deg); pointer-events: none; z-index: 40; font-weight: 900; letter-spacing: 0.5em; white-space: nowrap; }
        
        .active-card { border: 2px solid #d4af37 !important; box-shadow: 0 0 40px rgba(212,175,55,0.4); transform: scale(1.02); }
        .hidden-download { display: none; }
    </style>
</head>
<body oncontextmenu="return false">

    <nav class="w-full p-8 flex justify-between items-center max-w-6xl mx-auto">
        <div class="font-luxury text-[10px] tracking-[0.8em] gold-shimmer uppercase">Elite Asset Node</div>
        <div class="flex items-center gap-4">
            <div class="text-[8px] tracking-widest text-zinc-500 uppercase">Status: <span class="text-green-500">Accelerated</span></div>
        </div>
    </nav>

    <main id="view-start" class="w-full max-w-2xl mx-auto text-center mt-12 px-6 transition-all duration-700">
        <h1 class="font-luxury text-5xl md:text-7xl mb-4 tracking-tighter">AI <span class="gold-shimmer">ARCHITECT</span></h1>
        <p class="text-zinc-600 text-[9px] tracking-[0.8em] mb-12 uppercase">Professional Grade 8K Visual Assets</p>
        
        <div class="glass p-1 rounded-[3rem] mb-10">
            <textarea id="prompt-input" rows="3" 
                      placeholder="DESCRIBE YOUR VISION..." 
                      class="w-full bg-transparent border-none text-white text-center text-xl focus:outline-none resize-none p-12 font-light tracking-wide"></textarea>
        </div>
        <button onclick="startBatch()" class="w-full py-8 rounded-full bg-[#d4af37] text-black font-luxury text-[10px] tracking-[0.6em] font-black uppercase hover:bg-white transition-all shadow-2xl">Generate Elite Assets</button>
    </main>

    <section id="view-gallery" class="hidden w-full max-w-6xl mx-auto mt-6 px-6 opacity-0 transition-all duration-1000">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="output-grid"></div>

        <div id="pricing-tier" class="hidden mt-12 glass p-10 rounded-[3.5rem] max-w-xl mx-auto text-center animate-fade-in relative overflow-hidden">
            <div class="relative z-10">
                <div class="font-luxury text-sm tracking-[1em] gold-shimmer mb-6 uppercase">Commercial Unlock</div>
                <div class="text-6xl font-luxury mb-4">$29.99</div>
                <ul class="text-[9px] tracking-widest text-zinc-400 mb-10 space-y-2 uppercase">
                    <li>● 8K Lossless Uncompressed Original</li>
                    <li>● Worldwide Commercial Usage License</li>
                    <li>● Remove All Dynamic Watermarks</li>
                    <li>● AI Metadata Architecture Included</li>
                </ul>
                <button onclick="processPay()" class="w-full py-6 rounded-2xl bg-[#d4af37] text-black font-luxury text-[11px] tracking-[0.5em] mb-4 uppercase font-bold hover:bg-white transition-all">Acquire Ownership</button>
                <button id="dl-ready" onclick="doDownload()" class="hidden-download w-full py-6 border border-zinc-700 rounded-2xl font-luxury text-[10px] tracking-[0.5em] text-white uppercase hover:bg-white hover:text-black transition-all">Download Master Asset</button>
            </div>
        </div>
    </section>

    <script>
        let currentTarget = '';

        function startBatch() {
            const p = document.getElementById('prompt-input').value;
            if(!p) return;

            document.getElementById('view-start').classList.add('hidden');
            const gallery = document.getElementById('view-gallery');
            gallery.classList.remove('hidden');
            setTimeout(() => { gallery.classList.add('opacity-100'); }, 50);

            const grid = document.getElementById('output-grid');
            grid.innerHTML = '';

            // 🚀 并行引擎：4路齐发，不阻塞加载
            for(let i=0; i<4; i++) {
                const seed = Math.floor(Math.random() * 999999);
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ", high-end luxury, 8k, sharp focus, magazine style")}?model=flux&seed=${seed}&width=1024&height=1024&nologo=true`;
                
                const container = document.createElement('div');
                container.className = "img-container glass";
                container.innerHTML = `
                    <div class="shield" onclick="select(this, '${url}')"></div>
                    <div class="watermark">AI ELITE FACTORY ● PROTECTED</div>
                    <img src="${url}" class="w-full h-full object-cover opacity-0 transition-opacity duration-500" onload="this.classList.remove('opacity-0')">
                `;
                grid.appendChild(container);
            }
        }

        function select(el, url) {
            document.querySelectorAll('.img-container').forEach(c => c.classList.remove('active-card'));
            el.parentElement.classList.add('active-card');
            currentTarget = url;
            document.getElementById('pricing-tier').classList.remove('hidden');
            document.getElementById('dl-ready').style.display = 'none';
        }

        function processPay() {
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            setTimeout(() => {
                if(confirm("Neural Verification: Is the payment of $29.99 completed?")) {
                    const activeImg = document.querySelector('.active-card');
                    activeImg.querySelector('.watermark').style.display = 'none';
                    document.getElementById('dl-ready').style.display = 'block';
                    alert("Ownership Confirmed. Asset Unlocked.");
                }
            }, 1000);
        }

        function doDownload() {
            const a = document.createElement('a');
            a.href = currentTarget;
            a.download = `Elite_Asset_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 屏蔽所有可能的快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key==='s' || e.key==='u' || e.key==='i' || e.key==='p')) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
        });
    </script>
</body>
</html>
