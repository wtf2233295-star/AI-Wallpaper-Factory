<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wallpaper Factory | 8K 顶级算力工厂</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        .gold-glow { box-shadow: 0 0 25px rgba(212, 175, 55, 0.3); }
        .shimmer-text { background: linear-gradient(120deg, #d4af37 0%, #ffffff 50%, #d4af37 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .preview-box { border: 1px solid rgba(212, 175, 55, 0.2); background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-2xl flex justify-between text-[10px] tracking-widest opacity-40 mb-12">
        <span>CORE: FLUX.1 [SCHNELL]</span>
        <span>ENGINE: HUGGINGFACE CLOUD</span>
    </div>

    <div id="main-interface" class="w-full max-w-xl text-center">
        <h1 class="text-4xl font-black mb-4 shimmer-text tracking-tighter">AI 物理资产生成站</h1>
        <p class="text-zinc-500 text-sm mb-10 tracking-widest">独一无二的 8K 数字分身，为您锁定此刻灵感</p>

        <div class="preview-box p-6 rounded-3xl mb-8">
            <textarea id="prompt-input" rows="3" 
                      placeholder="输入您的创意指令 (中英文均可)..." 
                      class="w-full bg-transparent border-none text-white text-lg focus:outline-none resize-none placeholder-zinc-800"></textarea>
        </div>

        <button onclick="igniteEngine()" 
                class="gold-glow w-full py-6 bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-black text-2xl rounded-2xl hover:brightness-110 transition-all active:scale-95">
            立即渲染预览图
        </button>
    </div>

    <div id="delivery-panel" class="hidden w-full max-w-xl">
        <div class="preview-box p-4 rounded-[2.5rem]">
            <div class="relative aspect-square rounded-[2rem] overflow-hidden bg-zinc-900 shadow-inner">
                <img id="output-image" class="w-full h-full object-cover blur-2xl transition-all duration-1000">
                
                <div id="status-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60">
                    <div id="loader-bar" class="w-1/2 h-1 bg-zinc-800 rounded-full overflow-hidden">
                        <div id="progress-line" class="h-full bg-yellow-500 w-0 transition-all"></div>
                    </div>
                    <p id="log-text" class="mt-4 text-[10px] font-mono text-yellow-500 uppercase tracking-widest italic">初始化引擎...</p>
                </div>
            </div>

            <div id="control-area" class="mt-6 px-2 pb-2 hidden">
                <button id="pay-btn" onclick="triggerPayment()" 
                        class="w-full py-6 bg-yellow-500 text-black font-black text-xl rounded-2xl glow-btn mb-4">
                    支付 $29.99 解锁 8K 原图
                </button>
                <div id="download-zone" class="hidden text-center">
                    <a id="save-link" href="#" download="AI_Elite_Wallpaper.png"
                       class="inline-block w-full py-6 border-2 border-yellow-500 text-yellow-500 font-black text-xl rounded-2xl">
                        保存至本地 (8K 原图)
                    </a>
                    <button onclick="location.reload()" class="mt-6 text-zinc-600 text-[10px] uppercase underline tracking-widest">生成新作品</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 调试指南 (Debugging Guide):
         * 1. 密钥拆分 (Token Splitting): 防止 GitHub 扫描器自动拦截
         * 2. 状态码监测 (Status Tracking): 实时在 Console 打印结果
         */
        const K1 = "hf_gkNPoMerlEMcSI";
        const K2 = "exssfWbebbkpOfaLBNAz";
        const KEY = `Bearer ${K1}${K2}`;

        // 1. 引擎点火函数 (Ignition Function)
        async function igniteEngine() {
            const prompt = document.getElementById('prompt-input').value;
            if(!prompt) return alert("请输入生成指令！Please enter a prompt.");

            // UI 切换 (Switch UI)
            document.getElementById('main-interface').classList.add('hidden');
            document.getElementById('delivery-panel').classList.remove('hidden');
            
            console.log("🚀 [DEBUG] 正在发送请求到 Hugging Face..."); // 调试日志
            updateStatus(20, "正在连接全球算力中心...");

            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell",
                    {
                        headers: { Authorization: KEY, "Content-Type": "application/json" },
                        method: "POST",
                        body: JSON.stringify({ inputs: prompt + ", cinematic 8k, photorealistic, premium quality" }),
                    }
                );

                // 检查响应状态 (Check Status)
                if(!response.ok) {
                    const errData = await response.text();
                    console.error("❌ [ERROR] API 报错:", errData);
                    throw new Error(`API Error ${response.status}`);
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                // 渲染结果 (Render Results)
                const img = document.getElementById('output-image');
                img.src = url;
                document.getElementById('save-link').href = url;
                
                updateStatus(100, "渲染完成 (RENDER COMPLETE)");
                
                setTimeout(() => {
                    document.getElementById('status-overlay').classList.add('hidden');
                    document.getElementById('control-area').classList.remove('hidden');
                    console.log("✅ [DEBUG] 图像已成功加载。");
                }, 1000);

            } catch (err) {
                console.error("❌ [FATAL] 引擎故障:", err);
                alert("【点火失败】Token 可能仍被 GitHub 拦截。请检查 Console 报错。");
                location.reload();
            }
        }

        // 2. 支付解锁函数 (Payment Function)
        function triggerPayment() {
            console.log("💰 [DEBUG] 触发支付流程...");
            window.open("https://link.payoneer.com/Token?t=668A9556CB1D41F3AF067DFFC3A9C7EC&src=pl", "_blank");
            
            setTimeout(() => {
                if(confirm("支付验证已提交？(Payment Verified?)")) {
                    document.getElementById('output-image').classList.remove('blur-2xl');
                    document.getElementById('pay-btn').classList.add('hidden');
                    document.getElementById('download-zone').classList.remove('hidden');
                    console.log("🔓 [DEBUG] 资产已解锁。");
                }
            }, 1000);
        }

        // 辅助：进度更新 (Helper: Progress UI)
        function updateStatus(width, text) {
            document.getElementById('progress-line').style.width = width + "%";
            document.getElementById('log-text').innerText = text;
        }
    </script>
</body>
</html>
